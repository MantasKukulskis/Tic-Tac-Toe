<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <section class="container">
    <div class="row">
      <div class="game-name">Tic-Tac-Toe</div>

      <div class="all-buttons m-3">
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
        <button class="btn"></button>
      </div>

      <button id="restartBtn" class="restart-btn">Restart Game</button>

      <div class="result col-5 m-4">Choose X or O to start!</div>

      <div class="choose">
        Choose your symbol:
        <img class="symbol" data-symbol="X" src="./img/cross.svg" alt="Cross" />
        <img class="symbol" data-symbol="O" src="./img/zero.svg" alt="Zero" />
      </div>
    </div>
  </section>

  <script src="./index.js"></script>
</body>
</html>
